name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Only Linux for now, to keep iteration fast while the feature is being
    # built. macOS and Windows come back before release; nothing in the suite is
    # allowed to depend on the host, so their return is a workflow change and
    # not a test change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test with the race detector
        run: go test -race ./...
      # `sal upgrade` picks an asset per platform and has one source file per
      # operating system, so every platform the release builds for must at
      # least compile here.
      - name: Cross-compile the release targets
        run: |
          set -eu
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 android/arm64; do
            os="${pair%/*}"; arch="${pair#*/}"
            echo "building $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o /dev/null .
          done
