name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The suite is portability-tested against every platform the release builds
    # for, so a change that only works on Linux cannot land. Windows and macOS
    # run the tests; the race detector runs where it is supported.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: true
          - os: macos-latest
            race: true
          - os: windows-latest
            race: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
        shell: bash
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test with the race detector
        if: matrix.race
        run: go test -race ./...

  # `sal upgrade` picks an asset per platform and has one source file per
  # operating system, so every platform the release builds for must at least
  # compile. This is a cross-compile check, not a test: the platform tests above
  # run natively.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile the release targets
        run: |
          set -eu
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${pair%/*}"; arch="${pair#*/}"
            echo "building $os/$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -o /dev/null .
          done
