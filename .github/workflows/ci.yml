name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Only Linux for now, to keep iteration fast while the feature is being
    # built. macOS and Windows come back before release; nothing in the suite is
    # allowed to depend on the host, so their return is a workflow change and
    # not a test change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test with the race detector
        run: go test -race ./...
